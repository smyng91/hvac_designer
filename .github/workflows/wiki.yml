name: Wiki

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - examples/README.md
      - validation/README.md
      - validation/data/SOURCES.md
      - data/README.md
      - data/maps/SOURCES.md
      - scripts/github_md.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable wiki
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f has_wiki=true
      - name: Build and push wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/github_md.py --wiki /tmp/wiki-src
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if git clone "$remote" /tmp/wiki; then
            rsync -a --delete --exclude .git /tmp/wiki-src/ /tmp/wiki/
          else
            mkdir /tmp/wiki
            rsync -a /tmp/wiki-src/ /tmp/wiki/
            git -C /tmp/wiki init -b master
            git -C /tmp/wiki remote add origin "$remote"
          fi
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes"
            exit 0
          fi
          git commit -m "Publish docs from ${GITHUB_SHA}"
          if ! git push -u origin HEAD; then
            echo "::error::Wiki git repo does not exist yet. While logged in as the owner, open"
            echo "https://github.com/${GITHUB_REPOSITORY}/wiki and click Create the first page,"
            echo "then re-run this workflow."
            exit 1
          fi

