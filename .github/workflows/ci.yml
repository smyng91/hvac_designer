name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Design package (heating)
        run: python -m heatpump.simulate --design-only --mode heating -r R32 --load 5500 --T-out 0 --T-zone 20 --out /tmp/hp
      - name: Design package (cooling)
        run: python -m heatpump.simulate --design-only --mode cooling -r R410A --load 6200 --T-out 35 --T-zone 24 --out /tmp/ac
