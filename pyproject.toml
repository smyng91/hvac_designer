[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpump"
version = "0.1.0"
description = "Transient two-phase vapor-compression heat pump / air conditioner in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "CoolProp>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heatpump-sim = "heatpump.simulate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
