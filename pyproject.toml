[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpump"
version = "0.1.0"
description = "Transient two-phase vapor-compression heat pump / air conditioner in JAX"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sam Yang"}]
requires-python = ">=3.10"
keywords = ["heat-pump", "vapor-compression", "JAX", "HVAC", "CoolProp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "CoolProp>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/smyng91/hvac_designer"
Repository = "https://github.com/smyng91/hvac_designer"

[project.scripts]
heatpump-sim = "heatpump.simulate:main"
heatpump-validate = "heatpump.validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
